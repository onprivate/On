<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Booking</title>

<style>
body {font-family: Arial; background:#f5f5f5; margin:0;}
.header {background:#0b3d91;color:#fff;padding:15px;text-align:center;}

.box {
background:#fff;
margin:20px;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, button {
width:100%;
padding:12px;
margin-top:10px;
border-radius:5px;
border:1px solid #ccc;
}

button {
background:orange;
color:white;
border:none;
font-size:16px;
}

.hidden {display:none;}
</style>
</head>

<body>

<div class="header">Gas Booking Service</div>

<!-- PAGE 1 -->
<div class="box" id="page1">
<h3>Consumer Details</h3>

<input type="text" id="name" placeholder="Enter Name">
<input type="tel" id="mobile" placeholder="Mobile Number">

<button onclick="nextPage()">Proceed →</button>
</div>

<!-- PAGE 2 -->
<div class="box hidden" id="page2">
<h3>Booking Confirmation</h3>

<p id="userData"></p>

<p><b>Service Charge: ₹1</b></p>

<button onclick="payNow()">Pay Now</button>
</div>

<script>
function nextPage(){
let name = document.getElementById("name").value;
let mobile = document.getElementById("mobile").value;

if(name=="" || mobile==""){
alert("Fill all details");
return;
}

// show data
document.getElementById("userData").innerHTML =
"Name: "+name+"<br>Mobile: "+mobile;

// switch page
document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="block";
}

function payNow(){
let upi = "upi://pay?pa=YOURUPI@upi&pn=GasBooking&am=1&cu=INR";
window.location.href = upi;
}
</script>

</body>
</html>
