<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPG Gas Booking Portal</title><style>
body {
  font-family: Arial, sans-serif;
  background:#e9eef3;
  margin:0;
}

.header {
  background:#003366;
  color:#fff;
  padding:14px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.box {
  background:#ffffff;
  margin:20px;
  padding:20px;
  border-radius:10px;
  border:1px solid #dcdcdc;
}

h3 {
  color:#003366;
}

/* Gas Options */
.gas-options {
  display:flex;
  gap:8px;
}

.gas-card {
  flex:1;
  padding:14px;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
  border:1px solid #ccc;
  background:#f5f7fa;
}

.gas-card.active {
  border:2px solid #003366;
  background:#dce8f7;
  font-weight:bold;
}

input {
  width:100%;
  padding:11px;
  margin-top:10px;
  border:1px solid #ccc;
  border-radius:6px;
}

button {
  width:100%;
  padding:12px;
  margin-top:16px;
  background:#003366;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
}

#qrcode {
  text-align:center;
  margin-top:15px;
}

#timer {
  text-align:center;
  margin-top:10px;
  font-weight:bold;
  color:#003366;
}

.success {
  text-align:center;
  margin-top:20px;
}

.success h3 {
  color:green;
}

.hidden {display:none;}
</style></head><body><div class="header">LPG Gas Booking Portal</div><!-- PAGE 1 --><div class="box" id="page1"><h3>Select Gas Provider</h3>
<div class="gas-options">
  <div class="gas-card" onclick="selectGas('Indian')" id="indian">Indian</div>
  <div class="gas-card" onclick="selectGas('Bharat')" id="bharat">Bharat</div>
  <div class="gas-card" onclick="selectGas('HP')" id="hp">HP</div>
</div><p id="selectedGas" style="margin-top:10px;font-weight:bold;"></p><h3>Consumer Details</h3>
<input type="text" id="name" placeholder="Enter Name">
<input type="number" id="mobile" placeholder="Mobile Number">
<input type="text" id="address" placeholder="Enter Address">
<input type="text" id="state" placeholder="Enter State"><button onclick="goToPayment()">Book Now</button>

</div><!-- PAGE 2 --><div class="box hidden" id="page2"><h3>Payment</h3><p id="summary"></p><div id="qrcode"></div><div id="timer"></div><div id="paidBox" class="success hidden">
  <h3>✅ Payment Received</h3>
  <p>🚚 Delivery in 2–3 working days</p>
</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
let selectedGas = "";

function selectGas(type) {
  selectedGas = type;

  document.getElementById("indian").classList.remove("active");
  document.getElementById("bharat").classList.remove("active");
  document.getElementById("hp").classList.remove("active");

  document.getElementById(type.toLowerCase()).classList.add("active");

  document.getElementById("selectedGas").innerHTML =
    "Selected: " + type;
}

function goToPayment() {
  let name = document.getElementById("name").value;
  let mobile = document.getElementById("mobile").value;
  let address = document.getElementById("address").value;
  let state = document.getElementById("state").value;

  if(selectedGas=="" || name=="" || mobile=="" || address=="" || state==""){
    alert("Please fill all details");
    return;
  }

  let id = "LPG" + Math.floor(Math.random()*100000);

  document.getElementById("summary").innerHTML =
    "Booking ID: " + id +
    "<br>Gas: " + selectedGas +
    "<br>Name: " + name +
    "<br>Mobile: " + mobile +
    "<br>Address: " + address +
    "<br>State: " + state;

  // Show page 2
  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");

  // QR Generate
  let upi = "upi://pay?pa=yourupiid@upi&pn=LPGBooking&am=1&cu=INR";

  new QRCode(document.getElementById("qrcode"), {
    text: upi,
    width: 160,
    height: 160
  });

  // Timer
  let timeLeft = 120;

  let timerInterval = setInterval(() => {
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;

    document.getElementById("timer").innerHTML =
      "⏳ Time Left: " + m + ":" + (s<10?"0":"") + s;

    timeLeft--;

    if(timeLeft < 0){
      clearInterval(timerInterval);

      document.getElementById("timer").innerHTML = "Payment Completed";
      document.getElementById("paidBox").classList.remove("hidden");
    }

  }, 1000);
}
</script></body>
</html>
