<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaming Hub</title><style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(#020617,#0f172a);
  color:#fff;
  text-align:center;
}

/* PROFILE */
.profile img {
  width:100px;
  border-radius:50%;
  margin-top:25px;
  border:3px solid #22c55e;
}

.name {
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
}

.followers {
  color:#22c55e;
  font-size:14px;
}

/* STATS */
.stats {
  display:flex;
  justify-content:space-around;
  margin:20px;
}

.card {
  background:#111827;
  padding:15px;
  border-radius:12px;
  width:28%;
}

.card strong {
  font-size:18px;
  color:#22c55e;
}

/* BUTTON */
.btn {
  margin:20px;
}

.btn button {
  width:90%;
  padding:15px;
  border:none;
  border-radius:12px;
  background: linear-gradient(90deg,#06b6d4,#9333ea);
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

/* TIMER BOX */
.timer-box {
  margin:20px;
  background:#111827;
  padding:20px;
  border-radius:12px;
}

.timer {
  display:flex;
  justify-content:space-around;
  font-size:22px;
  margin-top:10px;
}

.label {
  font-size:12px;
  color:#aaa;
}

/* SECTION */
.section {
  margin:20px;
  background:#111827;
  padding:15px;
  border-radius:12px;
  text-align:left;
}
</style></head><body><div class="profile">
  <img src="https://i.imgur.com/8Km9tLL.jpg">
</div><div class="name">🎬 Streaming Hub</div>
<div class="followers">✔ 53K+ Active Users</div><!-- STATS --><div class="stats">
  <div class="card">
    <strong>10K+</strong><br>Movies
  </div>
  <div class="card">
    <strong>LIVE</strong><br>IPL
  </div>
  <div class="card">
    <strong>4.9⭐</strong><br>Rating
  </div>
</div><!-- BUTTON --><div class="btn">
  <button onclick="joinNow()">📩 Join Telegram Channel</button>
</div><!-- TIMER --><div class="timer-box">
  <div>Next Update In</div>
  <div class="timer">
    <div><span id="h">00</span><br><span class="label">Hours</span></div>
    <div><span id="m">00</span><br><span class="label">Minutes</span></div>
    <div><span id="s">00</span><br><span class="label">Seconds</span></div>
  </div>
</div><!-- SECTION --><div class="section">
  🎬 Netflix | Hotstar | JioCinema | Sony LIV<br><br>
  HD Streaming • Fast Access • Daily Updates
</div><script>
function joinNow(){
  window.location.href="https://t.me/+iyOTawwHSBpjMGM9";
}

/* TIMER */
let time = 3600;

setInterval(()=>{
  let h = Math.floor(time/3600);
  let m = Math.floor((time%3600)/60);
  let s = time%60;

  document.getElementById("h").innerHTML = h;
  document.getElementById("m").innerHTML = m;
  document.getElementById("s").innerHTML = s;

  time--;
  if(time<0) time=3600;

},1000);
</script></body>
</html>
