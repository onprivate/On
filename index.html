<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPG Gas Booking Portal</title><style>
body {
  font-family: Arial, sans-serif;
  background:#e9eef3;
  margin:0;
}

/* Header */
.header {
  background:#003366;
  color:#fff;
  padding:14px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

/* Main Box */
.box {
  background:#ffffff;
  margin:20px;
  padding:20px;
  border-radius:10px;
  border:1px solid #dcdcdc;
}

/* Titles */
h3 {
  margin-bottom:12px;
  color:#003366;
}

/* Gas Options */
.gas-options {
  display:flex;
  gap:8px;
}

.gas-card {
  flex:1;
  padding:14px 6px;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
  border:1px solid #ccc;
  background:#f5f7fa;
  font-size:14px;
}

.gas-card.active {
  border:2px solid #003366;
  background:#dce8f7;
  font-weight:bold;
}

/* Inputs */
input {
  width:100%;
  padding:11px;
  margin-top:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

/* Button */
button {
  width:100%;
  padding:12px;
  margin-top:16px;
  background:#003366;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
  cursor:pointer;
}

/* QR */
#qrcode {
  text-align:center;
  margin-top:15px;
}

/* Success */
.success {
  text-align:center;
  margin-top:20px;
}

.success h3 {
  color:green;
}

.hidden {display:none;}
</style></head><body><div class="header">LPG Gas Booking Portal</div><div class="box"><h3>Select Gas Provider</h3><div class="gas-options">
  <div class="gas-card" onclick="selectGas('Indian')" id="indian">Indian</div>
  <div class="gas-card" onclick="selectGas('Bharat')" id="bharat">Bharat</div>
  <div class="gas-card" onclick="selectGas('HP')" id="hp">HP</div>
</div><p id="selectedGas" style="margin-top:10px;font-weight:bold;"></p><h3>Consumer Details</h3>
<input type="text" id="name" placeholder="Enter Name">
<input type="number" id="mobile" placeholder="Mobile Number"><p id="bookingId"></p><button onclick="startProcess()">Book & Pay</button>

<div id="qrcode"></div><div id="successBox" class="success hidden">
  <h3>Booking Successful</h3>
  <p>Delivery in 2–3 working days</p>
</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
let selectedGas = "";

function selectGas(type) {
  selectedGas = type;

  document.getElementById("indian").classList.remove("active");
  document.getElementById("bharat").classList.remove("active");
  document.getElementById("hp").classList.remove("active");

  if(type === "Indian"){
    document.getElementById("indian").classList.add("active");
  } 
  else if(type === "Bharat"){
    document.getElementById("bharat").classList.add("active");
  } 
  else {
    document.getElementById("hp").classList.add("active");
  }

  document.getElementById("selectedGas").innerHTML =
    "Selected: " + type;
}

function startProcess() {
  let name = document.getElementById("name").value;
  let mobile = document.getElementById("mobile").value;

  if(selectedGas==""){
    alert("Please select gas provider");
    return;
  }

  if(name=="" || mobile==""){
    alert("Please fill all details");
    return;
  }

  let id = "LPG" + Math.floor(Math.random()*100000);

  document.getElementById("bookingId").innerHTML =
    "Booking ID: " + id + "<br>Gas: " + selectedGas;

  let upi = "upi://pay?pa=yourupiid@upi&pn=LPGBooking&am=1&cu=INR";

  document.getElementById("qrcode").innerHTML = "";

  new QRCode(document.getElementById("qrcode"), {
    text: upi,
    width: 160,
    height: 160
  });

  setTimeout(() => {
    document.getElementById("successBox").classList.remove("hidden");
  }, 4000);
}
</script></body>
</html>
