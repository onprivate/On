<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Booking</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"><style>
body {
  font-family: 'Poppins', sans-serif;
  background:#f4f6f9;
  margin:0;
}

.header {
  background: linear-gradient(90deg,#0b3d91,#1e5ed8);
  color:#fff;
  padding:15px;
  text-align:center;
  font-weight:600;
}

.box {
  background:#fff;
  margin:20px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

input {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:linear-gradient(90deg,#ff9800,#ffb74d);
  color:white;
  font-weight:600;
  cursor:pointer;
}

.hidden {display:none;}

#qrcode {
  text-align:center;
  margin-top:20px;
}

.success {
  text-align:center;
  margin-top:20px;
}

.success h3 {
  color:green;
}

.delivery {
  color:#333;
  font-size:14px;
  margin-top:5px;
}
</style></head><body><div class="header">Gas Booking Service</div><div class="box"><h3>Consumer Details</h3>
<input type="text" id="name" placeholder="Enter Name">
<input type="number" id="mobile" placeholder="Mobile Number"><p id="bookingId"></p><h4>Service Charge: ₹1</h4><button onclick="startProcess()">Proceed & Pay</button>

<div id="qrcode"></div><div id="successBox" class="success hidden">
  <h3>✅ Booking Successful</h3>
  <p class="delivery">🚚 Delivery in 2–3 days</p>
</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
function startProcess() {
  let name = document.getElementById("name").value;
  let mobile = document.getElementById("mobile").value;

  if(name=="" || mobile==""){
    alert("Please fill all details");
    return;
  }

  // Booking ID generate
  let id = "GB" + Math.floor(Math.random()*100000);
  document.getElementById("bookingId").innerHTML = "Booking ID: " + id;

  // QR Code
  let upi = "upi://pay?pa=yourupiid@upi&pn=GasBooking&am=1&cu=INR";

  document.getElementById("qrcode").innerHTML = "";

  new QRCode(document.getElementById("qrcode"), {
    text: upi,
    width: 180,
    height: 180
  });

  // After 5 sec show success
  setTimeout(() => {
    document.getElementById("successBox").classList.remove("hidden");
  }, 5000);
}
</script></body>
</html>
